name: Generate Breach Dashboard Data

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate breach-data.js
        run: python generate_breach_data_from_drive.py
        env:
          DRIVE_FOLDER_ID: 1yg06zp_7OMYZzkNnHDovUSHF7zdW8mTc

      - name: Generate conversion-data.js
        run: python generate_conversion_data_from_drive.py
        env:
          CONVERSION_DRIVE_FOLDER_ID: 1F2YPnY2PbFaR8MY-mXn8pqM_B6xd9Ejt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
